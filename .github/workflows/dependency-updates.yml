name: Automated Dependency Updates

on:
  schedule:
    # Daily: compatible updates within the current major → push to dev
    - cron: '0 5 * * *'
      timezone: Europe/Amsterdam
    # Monthly (1st at 06:00): major updates → PR
    - cron: '0 6 1 * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      update_type:
        description: Update type (minor pushes to dev; major opens a PR)
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install Cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-edit,cargo-audit

      - id: resolve-type
        name: Resolve update type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "update_type=${{ inputs.update_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 1 * *" ]; then
            echo "update_type=major" >> "$GITHUB_OUTPUT"
          else
            echo "update_type=minor" >> "$GITHUB_OUTPUT"
          fi

      - id: apply-updates
        name: Check and apply dependency updates
        env:
          UPDATE_TYPE: ${{ steps.resolve-type.outputs.update_type }}
        run: |
          report_file="$RUNNER_TEMP/cargo-upgrade.md"
          # Cargo.toml keeps exact "=" requirements. --pinned moves those to the new version.
          if [ "$UPDATE_TYPE" = "major" ]; then
            echo '## Major updates' > "$report_file"
            cargo upgrade --dry-run --pinned --incompatible | tee -a "$report_file"
            cargo upgrade --pinned --incompatible
          else
            echo '## Compatible updates' > "$report_file"
            cargo upgrade --dry-run --pinned | tee -a "$report_file"
            cargo upgrade --pinned
          fi

          # Pin the builder to the newest stable Rust and the digest of its bookworm image.
          rust_version="$(curl -fsSL "https://static.rust-lang.org/dist/channel-rust-stable.toml" | awk '
            $0 == "[pkg.rust]" { in_rust = 1; next }
            in_rust && /^version = / { gsub(/"/, "", $3); print $3; exit }
            in_rust && /^\[/ { exit }
          ')"
          if ! [[ "$rust_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Rust version: ${rust_version:-empty}"
            exit 1
          fi
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/rust:pull" | jq -r '.token')"
          rust_digest="$(curl -fsSL -D - -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/rust/manifests/${rust_version}-bookworm" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" { print $2; exit }')"
          if ! [[ "$rust_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected Rust image digest: ${rust_digest:-empty}"
            exit 1
          fi
          rust_pinned="${rust_version}-bookworm@${rust_digest}"
          rust_current="$(sed -n 's/^FROM rust:\([^ ]*\).*/\1/p' Dockerfile | head -1)"
          rust_changed=false
          if [ "$rust_current" = "$rust_pinned" ]; then
            echo "Rust builder already pinned to ${rust_pinned}."
          else
            echo "Rust builder ${rust_current:-unpinned} -> ${rust_pinned}"
            printf '\n## Rust\n\n- builder `%s` -> `%s`\n' "${rust_current:-unpinned}" "$rust_pinned" >> "$report_file"
            sed -i "s|^FROM rust:.*|FROM rust:${rust_pinned} AS builder|" Dockerfile
            rust_changed=true
          fi
          for workflow in .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml; do
            workflow_toolchain="$(sed -n "s/.*toolchain: ['\"]\([0-9][0-9.]*\)['\"].*/\1/p" "$workflow" | head -1)"
            if [ -z "$workflow_toolchain" ] || [ "$workflow_toolchain" = "$rust_version" ]; then
              continue
            fi
            echo "Rust toolchain in ${workflow}: ${workflow_toolchain} -> ${rust_version}"
            if [ "$rust_changed" = false ]; then
              printf '\n## Rust\n\n' >> "$report_file"
            fi
            printf -- '- `%s` toolchain `%s` -> `%s`\n' "$workflow" "$workflow_toolchain" "$rust_version" >> "$report_file"
            sed -i -E "s/(toolchain: ['\"])[0-9]+\\.[0-9]+\\.[0-9]+(['\"])/\\1${rust_version}\\2/" "$workflow"
            rust_changed=true
          done

          # Pin the runtime image to the current distroless nonroot digest. The tag stays nonroot (uid 65532).
          token="$(curl -fsSL "https://gcr.io/v2/token?service=gcr.io&scope=repository:distroless/static-debian13:pull" | jq -r '.token')"
          runtime_digest="$(curl -fsSL -D - -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://gcr.io/v2/distroless/static-debian13/manifests/nonroot" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" { print $2; exit }')"
          if ! [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected distroless digest: ${runtime_digest:-empty}"
            exit 1
          fi
          runtime_pinned="gcr.io/distroless/static-debian13:nonroot@${runtime_digest}"
          runtime_current="$(sed -n 's/^FROM //p' Dockerfile | grep '^gcr.io/distroless/static-debian13:nonroot@' | head -1)"
          if [ "$runtime_current" = "$runtime_pinned" ]; then
            echo "Distroless runtime already pinned to ${runtime_pinned}."
          else
            echo "Distroless runtime ${runtime_current:-unpinned} -> ${runtime_pinned}"
            printf '\n## Runtime image\n\n- `%s` -> `%s`\n' "${runtime_current:-unpinned}" "$runtime_pinned" >> "$report_file"
            sed -i "s|^FROM gcr.io/distroless/static-debian13:nonroot.*|FROM ${runtime_pinned}|" Dockerfile
          fi

          echo "rust_version=${rust_version}" >> "$GITHUB_OUTPUT"
          echo "rust_changed=${rust_changed}" >> "$GITHUB_OUTPUT"

          if git diff --quiet --exit-code -- Cargo.toml Cargo.lock Dockerfile .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml; then
            echo "No dependency updates available."
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_major_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          if [ "$UPDATE_TYPE" = "major" ]; then
            echo "has_major_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_major_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit when nothing was upgraded
        if: steps.apply-updates.outputs.has_changes != 'true' && steps.apply-updates.outputs.status == 'success'
        run: cargo audit

      - name: Install updated Rust toolchain
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.apply-updates.outputs.rust_version }}
          components: clippy, rustfmt, llvm-tools-preview

      - name: Format, lint, and coverage
        if: steps.apply-updates.outputs.has_changes == 'true'
        run: |
          cargo check-fmt
          cargo lint
          cargo coverage

      - name: Push dependency updates to dev
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.has_major_changes != 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock Dockerfile .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml
          if git diff --staged --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: update dependencies (automated)"
          git push origin HEAD:dev

      - name: Create pull request for major dependency updates
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.has_major_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/deps-major-update
          add-paths: |
            Cargo.toml
            Cargo.lock
            Dockerfile
            .github/workflows/ci.yml
            .github/workflows/deploy.yml
            .github/workflows/dependency-updates.yml
          commit-message: |
            chore: update dependencies (automated, major)
          title: 'chore: update dependencies (major)'
          body-path: ${{ runner.temp }}/cargo-upgrade.md
          labels: dependencies, automated, major
          delete-branch: true
          base: dev
          assignees: mikelock-1991
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>

      - name: No changes summary
        if: steps.apply-updates.outputs.has_changes != 'true'
        run: echo "No dependency updates. cargo audit passed."
