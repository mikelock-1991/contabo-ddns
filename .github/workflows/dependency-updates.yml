name: Automated Dependency Updates

on:
  schedule:
    # Daily: compatible updates within the current major → push to dev
    - cron: '0 5 * * *'
      timezone: Europe/Amsterdam
    # Monthly (1st at 06:00): major updates → PR
    - cron: '0 6 1 * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      update_type:
        description: Update type (minor pushes to dev; major opens a PR)
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update dependencies
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install Cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-edit,cargo-audit

      - id: resolve-type
        name: Resolve update type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "update_type=${{ inputs.update_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 1 * *" ]; then
            echo "update_type=major" >> "$GITHUB_OUTPUT"
          else
            echo "update_type=minor" >> "$GITHUB_OUTPUT"
          fi

      - name: Install QEMU for arm64 package checks
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - id: apply-updates
        name: Check and apply dependency updates
        env:
          UPDATE_TYPE: ${{ steps.resolve-type.outputs.update_type }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          report_file="$RUNNER_TEMP/cargo-upgrade.md"
          # Cargo.toml keeps exact "=" requirements. cargo-edit 0.13's --pinned
          # moves those pins to the newest release, including incompatible ones.
          # That is the monthly major path. A minor run must stay inside semver
          # compatibility, or reqwest 0.13 drops rustls-tls-native-roots and the
          # build fails.
          if [ "$UPDATE_TYPE" = "major" ]; then
            echo '## Major updates' > "$report_file"
            cargo upgrade --dry-run --pinned --incompatible | tee -a "$report_file"
            cargo upgrade --pinned --incompatible
          else
            echo '## Compatible updates' > "$report_file"
            python3 - << 'PY' | tee -a "$report_file"
          import json, re, subprocess
          from pathlib import Path

          manifest = Path("Cargo.toml")
          lines = manifest.read_text().splitlines(keepends=True)
          updated = []
          in_dependencies = False
          changes = []

          def parse_version(version):
              return tuple(int(part) for part in version.split("."))

          def is_compatible(current, candidate):
              current_parts = parse_version(current)
              candidate_parts = parse_version(candidate)
              if candidate_parts < current_parts:
                  return False
              if current_parts[0] == 0 and current_parts[1] == 0:
                  return candidate_parts == current_parts
              if current_parts[0] == 0:
                  return candidate_parts[0] == 0 and candidate_parts[1] == current_parts[1]
              return candidate_parts[0] == current_parts[0]

          for line in lines:
              stripped = line.strip()
              if stripped == "[dependencies]":
                  in_dependencies = True
                  updated.append(line)
                  continue
              if in_dependencies and stripped.startswith("["):
                  in_dependencies = False
              pin = re.search(r'"=([0-9]+\.[0-9]+\.[0-9]+)"', line)
              if not in_dependencies or pin is None or stripped.startswith("#"):
                  updated.append(line)
                  continue
              name = line.split("=", 1)[0].strip()
              current = pin.group(1)
              listing = subprocess.check_output(
                  [
                      "curl", "-fsSL", "-A", "contabo-ddns-dependency-updates",
                      f"https://crates.io/api/v1/crates/{name}",
                  ],
                  text=True,
              )
              best = current
              for item in json.loads(listing)["versions"]:
                  if item.get("yanked"):
                      continue
                  number = item["num"]
                  if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", number):
                      continue
                  if is_compatible(current, number) and parse_version(number) > parse_version(best):
                      best = number
              if best != current:
                  line = line.replace(f'"={current}"', f'"={best}"', 1)
                  changes.append((name, current, best))
              updated.append(line)

          manifest.write_text("".join(updated))
          print(f"{'name':<16} {'old req':<12} new req")
          print(f"{'====':<16} {'=======':<12} =======")
          if not changes:
              print("no compatible updates")
          for name, old, new in changes:
              print(f"{name:<16} ={old:<11} ={new}")
          PY
            cargo update
          fi

          # Pin the builder to the newest stable Rust Docker Hardened Image and its manifest-list digest.
          # dhi.io rejects anonymous tokens. The same Docker Hub credentials used to publish the image can pull.
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to pin dhi.io images"
            exit 1
          fi
          dhi_token() {
            local repo="$1"
            local body token
            body="$(curl -fsSL --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "https://dhi.io/token?service=registry.docker.io&scope=repository:${repo}:pull")" || return 1
            token="$(printf '%s\n' "$body" | jq -r '.token // .access_token // empty')" || return 1
            if [ -z "$token" ] || [ "$token" = "null" ]; then
              return 1
            fi
            printf '%s\n' "$token"
          }
          dhi_index_digest() {
            local repo="$1"
            local tag="$2"
            local token="$3"
            curl -fsSL -D - -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://dhi.io/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" { print $2; exit }'
          }
          channel_toml="$(mktemp)"
          curl -fsSL "https://static.rust-lang.org/dist/channel-rust-stable.toml" -o "$channel_toml"
          rust_version="$(awk '
            $0 == "[pkg.rust]" { in_rust = 1; next }
            in_rust && /^version = / { gsub(/"/, "", $3); print $3; exit }
            in_rust && /^\[/ { exit }
          ' "$channel_toml")"
          if ! [[ "$rust_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Rust version: ${rust_version:-empty}"
            exit 1
          fi
          rust_token="$(dhi_token rust)" || {
            echo "::error::dhi.io token request failed for rust"
            exit 1
          }
          rust_tag="${rust_version}-debian13-dev"
          rust_digest="$(dhi_index_digest rust "$rust_tag" "$rust_token" || true)"
          if ! [[ "$rust_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected Rust image digest for ${rust_tag}: ${rust_digest:-empty}"
            exit 1
          fi
          rust_pinned="${rust_tag}@${rust_digest}"
          rust_current="$(sed -n 's|^FROM dhi.io/rust:\([^ ]*\).*|\1|p' Dockerfile | head -1)"
          rust_changed=false
          if [ "$rust_current" = "$rust_pinned" ]; then
            echo "Rust builder already pinned to ${rust_pinned}."
          else
            echo "Rust builder ${rust_current:-unpinned} -> ${rust_pinned}"
            printf '\n## Rust\n\n- builder `%s` -> `%s`\n' "${rust_current:-unpinned}" "$rust_pinned" >> "$report_file"
            sed -i "s|^FROM dhi.io/rust:.*|FROM dhi.io/rust:${rust_pinned} AS builder|" Dockerfile
            rust_changed=true
          fi
          for workflow in .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml; do
            workflow_toolchain="$(sed -n "s/.*toolchain: ['\"]\([0-9][0-9.]*\)['\"].*/\1/p" "$workflow" | head -1)"
            if [ -z "$workflow_toolchain" ] || [ "$workflow_toolchain" = "$rust_version" ]; then
              continue
            fi
            echo "Rust toolchain in ${workflow}: ${workflow_toolchain} -> ${rust_version}"
            if [ "$rust_changed" = false ]; then
              printf '\n## Rust\n\n' >> "$report_file"
            fi
            printf -- '- `%s` toolchain `%s` -> `%s`\n' "$workflow" "$workflow_toolchain" "$rust_version" >> "$report_file"
            sed -i -E "s/(toolchain: ['\"])[0-9]+\\.[0-9]+\\.[0-9]+(['\"])/\\1${rust_version}\\2/" "$workflow"
            rust_changed=true
          done

          # Move the builder's apt pins to the candidate apt would install in
          # that image. Both architectures must agree, and the candidate must
          # install, before the Dockerfile changes.
          echo "${DOCKERHUB_TOKEN}" | docker login dhi.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          python3 - << 'PY' > "$RUNNER_TEMP/apt-packages.txt"
          import re
          from pathlib import Path

          found = []
          grab = False
          for line in Path("Dockerfile").read_text().splitlines():
              if "apt-get install" in line:
                  grab = True
                  continue
              if not grab:
                  continue
              stripped = line.strip()[:-1].strip() if line.strip().endswith("\\") else line.strip()
              match = re.fullmatch(r"([a-z0-9][a-z0-9.+-]*)=(\S+)", stripped)
              if match:
                  found.append(f"{match.group(1)} {match.group(2)}")
                  continue
              break
          if not found:
              raise SystemExit("no apt pins found in Dockerfile")
          print("\n".join(found))
          PY
          mapfile -t apt_packages < <(awk '{ print $1 }' "$RUNNER_TEMP/apt-packages.txt")
          apt_candidates() {
            local platform="$1"
            shift
            docker run --rm --user root --platform "$platform" --entrypoint sh \
              "dhi.io/rust:${rust_pinned}" -c '
                set -eu
                apt-get update -qq
                for pkg in "$@"; do
                  ver="$(apt-cache policy "$pkg" | awk "/Candidate:/ { print \$2; exit }")"
                  printf "%s %s\n" "$pkg" "$ver"
                done
              ' sh "$@"
          }
          apt_candidates linux/amd64 "${apt_packages[@]}" > "$RUNNER_TEMP/apt-amd64.txt"
          apt_candidates linux/arm64 "${apt_packages[@]}" > "$RUNNER_TEMP/apt-arm64.txt"
          if ! diff -q "$RUNNER_TEMP/apt-amd64.txt" "$RUNNER_TEMP/apt-arm64.txt" >/dev/null; then
            echo "::error::apt candidates differ between linux/amd64 and linux/arm64"
            diff -u "$RUNNER_TEMP/apt-amd64.txt" "$RUNNER_TEMP/apt-arm64.txt" || true
            exit 1
          fi
          if [ "$(wc -l < "$RUNNER_TEMP/apt-amd64.txt")" -ne "${#apt_packages[@]}" ]; then
            echo "::error::apt candidate query returned an unexpected package list"
            cat "$RUNNER_TEMP/apt-amd64.txt"
            exit 1
          fi
          while read -r pkg ver; do
            if ! [[ "$pkg" =~ ^[a-z0-9][a-z0-9.+-]*$ && "$ver" =~ ^[0-9][A-Za-z0-9.+~:-]*$ ]]; then
              echo "::error::Unexpected apt candidate for ${pkg:-empty}: ${ver:-empty}"
              exit 1
            fi
          done < "$RUNNER_TEMP/apt-amd64.txt"
          if ! diff -q "$RUNNER_TEMP/apt-packages.txt" "$RUNNER_TEMP/apt-amd64.txt" >/dev/null; then
            apt_install() {
              local platform="$1"
              shift
              docker run --rm --user root --platform "$platform" --entrypoint sh \
                "dhi.io/rust:${rust_pinned}" -c '
                  set -eu
                  apt-get update -qq
                  apt-get install -y --no-install-recommends "$@"
                ' sh "$@"
            }
            install_args=()
            while read -r pkg ver; do
              install_args+=("${pkg}=${ver}")
            done < "$RUNNER_TEMP/apt-amd64.txt"
            apt_install linux/amd64 "${install_args[@]}"
            apt_install linux/arm64 "${install_args[@]}"
            APT_CANDIDATES="$RUNNER_TEMP/apt-amd64.txt" python3 - << 'PY' | tee -a "$report_file"
          import os
          import re
          from pathlib import Path

          pins = {}
          for line in Path(os.environ["APT_CANDIDATES"]).read_text().splitlines():
              if not line.strip():
                  continue
              pkg, ver = line.split(" ", 1)
              pins[pkg] = ver

          path = Path("Dockerfile")
          original = path.read_text().splitlines(keepends=True)
          grab = False
          seen = set()
          changes = []
          updated = []
          for line in original:
              if "apt-get install" in line:
                  grab = True
                  updated.append(line)
                  continue
              if grab:
                  raw = line.strip()
                  body = raw[:-1].strip() if raw.endswith("\\") else raw
                  match = re.fullmatch(r"([a-z0-9][a-z0-9.+-]*)=(\S+)", body)
                  if match:
                      pkg, old = match.group(1), match.group(2)
                      new = pins[pkg]
                      seen.add(pkg)
                      if old != new:
                          changes.append((pkg, old, new))
                          indent = line[: len(line) - len(line.lstrip(" "))]
                          cont = " \\" if raw.endswith("\\") else ""
                          newline = "\n" if line.endswith("\n") else ""
                          line = f"{indent}{pkg}={new}{cont}{newline}"
                      updated.append(line)
                      continue
                  grab = False
              updated.append(line)

          missing = sorted(set(pins) - seen)
          if missing:
              raise SystemExit("pins not rewritten: " + ", ".join(missing))
          if not changes:
              raise SystemExit("apt candidates differed but no Dockerfile pin changed")
          path.write_text("".join(updated))
          print("\n## Builder packages\n")
          for pkg, old, new in changes:
              print(f"- `{pkg}` `{old}` -> `{new}`")
          PY
          fi

          # Pin the runtime to the newest plain Debian 13 static image (no glibc, no FIPS). nonroot is uid 65532.
          static_token="$(dhi_token static)" || {
            echo "::error::dhi.io token request failed for static"
            exit 1
          }
          tags_json="$(curl -fsSL \
            -H "Authorization: Bearer ${static_token}" \
            "https://dhi.io/v2/static/tags/list?n=1000")" || {
            echo "::error::Could not list dhi.io/static tags"
            exit 1
          }
          runtime_tag="$(printf '%s\n' "$tags_json" | jq -r '.tags[]?' | grep -E '^[0-9]{8}-debian13$' | sort | tail -1 || true)"
          if [ -z "$runtime_tag" ]; then
            echo "::error::No dhi.io/static tag matching YYYYMMDD-debian13"
            exit 1
          fi
          runtime_digest="$(dhi_index_digest static "$runtime_tag" "$static_token" || true)"
          if ! [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected static image digest for ${runtime_tag}: ${runtime_digest:-empty}"
            exit 1
          fi
          runtime_pinned="dhi.io/static:${runtime_tag}@${runtime_digest}"
          runtime_current="$(sed -n 's/^FROM //p' Dockerfile | grep '^dhi.io/static:' | head -1)"
          if [ "$runtime_current" = "$runtime_pinned" ]; then
            echo "Hardened runtime already pinned to ${runtime_pinned}."
          else
            echo "Hardened runtime ${runtime_current:-unpinned} -> ${runtime_pinned}"
            printf '\n## Runtime image\n\n- `%s` -> `%s`\n' "${runtime_current:-unpinned}" "$runtime_pinned" >> "$report_file"
            sed -i "s|^FROM dhi.io/static:.*|FROM ${runtime_pinned}|" Dockerfile
          fi

          echo "rust_version=${rust_version}" >> "$GITHUB_OUTPUT"
          echo "rust_changed=${rust_changed}" >> "$GITHUB_OUTPUT"

          if git diff --quiet --exit-code -- Cargo.toml Cargo.lock Dockerfile .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml; then
            echo "No dependency updates available."
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_major_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          if [ "$UPDATE_TYPE" = "major" ]; then
            echo "has_major_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_major_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit when nothing was upgraded
        if: steps.apply-updates.outputs.has_changes != 'true' && steps.apply-updates.outputs.status == 'success'
        run: cargo audit

      - name: Install updated Rust toolchain
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.apply-updates.outputs.rust_version }}
          components: clippy, rustfmt, llvm-tools-preview

      - name: Format, lint, and coverage
        if: steps.apply-updates.outputs.has_changes == 'true'
        run: |
          cargo check-fmt
          cargo lint
          cargo coverage

      - name: Push dependency updates to dev
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.has_major_changes != 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock Dockerfile .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/dependency-updates.yml
          if git diff --staged --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: update dependencies (automated)"
          git push origin HEAD:dev

      - name: Create pull request for major dependency updates
        if: steps.apply-updates.outputs.has_changes == 'true' && steps.apply-updates.outputs.has_major_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/deps-major-update
          add-paths: |
            Cargo.toml
            Cargo.lock
            Dockerfile
            .github/workflows/ci.yml
            .github/workflows/deploy.yml
            .github/workflows/dependency-updates.yml
          commit-message: |
            chore: update dependencies (automated, major)
          title: 'chore: update dependencies (major)'
          body-path: ${{ runner.temp }}/cargo-upgrade.md
          labels: dependencies, automated, major
          delete-branch: true
          base: dev
          assignees: mikelock-1991
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>

      - name: No changes summary
        if: steps.apply-updates.outputs.has_changes != 'true'
        run: echo "No dependency updates. cargo audit passed."
