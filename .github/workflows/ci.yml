name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # 2026-11-08
        with:
          tool: cargo-llvm-cov
      - run: cargo check-fmt
      - run: cargo lint
      - run: cargo coverage

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and load the runtime image
        run: docker buildx build --platform ${{ matrix.platform }} --load --tag contabo-ddns:ci .
      - name: Test DNS on user-defined bridge and macvlan networks
        timeout-minutes: 5
        run: bash tests/docker/network-smoke.sh contabo-ddns:ci
