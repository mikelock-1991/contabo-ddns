name: Build and publish container

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Git push and ruleset bypass use the pipeline GitHub App.
# GITHUB_TOKEN is only for GHCR. Docker Hub uses DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# After the image smoke test, the app creates or updates GitHub Release v<version>.
# dev keeps it a prerelease. main marks it as the latest release.
# The notes are regenerated from commits since the previous tag on every publish.
permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      dependency_update: ${{ steps.change_source.outputs.dependency_update }}
    permissions:
      contents: read
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Detect automated dependency update
        id: change_source
        run: |
          dependency_update=false
          echo "Event: ${{ github.event_name }}"

          for offset in $(seq 0 5); do
            subject="$(git show -s --format=%s "HEAD~${offset}" 2>/dev/null)" || break
            echo "Commit at HEAD~${offset}: ${subject:-[empty]}"

            if [ "$subject" = 'chore: update dependencies (automated)' ]; then
              dependency_update=true
              break
            fi
            if [ "$subject" = 'chore: update dependencies (automated, major)' ]; then
              break
            fi
            if [[ ! "$subject" =~ ^chore:\ bump\ patch\ version\ to\ .*\ \[skip\ ci\]$ ]]; then
              break
            fi
          done

          echo "dependency_update=${dependency_update}" >> "$GITHUB_OUTPUT"
          echo "Automated dependency update (non-major)? ${dependency_update}"

      - name: Install Rust
        if: github.ref_name == 'dev'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - name: Install cargo-edit
        if: github.ref_name == 'dev'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Prepare dev version
        id: dev_version
        if: github.ref_name == 'dev'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          cargo_version() {
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1
          }
          # Cargo.toml keeps the next stable version. Each dev publish gets {version}-beta.N.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH" --tags
            git reset --hard "origin/$BRANCH"
            base="$(cargo_version)"
            base="${base%%-*}"
            if git ls-remote --exit-code --tags origin "refs/tags/v${base}" >/dev/null; then
              IFS=. read -r major minor patch <<<"$base"
              next="${major}.${minor}.$((patch + 1))"
              cargo set-version "$next"
              git add Cargo.toml Cargo.lock
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump patch version to ${next} [skip ci]"
                if ! git push; then
                  if [ "$attempt" -eq 5 ]; then
                    echo "::error::Failed to push version bump after ${attempt} attempts"
                    exit 1
                  fi
                  echo "Push rejected (attempt ${attempt}); retrying from latest origin/${BRANCH}..."
                  continue
                fi
              fi
              base="$next"
            fi
            head_sha="$(git rev-parse HEAD)"
            reuse="$(git ls-remote --tags origin "refs/tags/v${base}-beta.*" | awk -v sha="$head_sha" '$1 == sha { sub("refs/tags/v", "", $2); print $2; exit }')"
            if [ -n "$reuse" ]; then
              version="$reuse"
            else
              n=1
              while git ls-remote --exit-code --tags origin "refs/tags/v${base}-beta.${n}" >/dev/null; do
                n=$((n + 1))
                if [ "$n" -gt 1000 ]; then
                  echo "::error::Too many beta tags for ${base}"
                  exit 1
                fi
              done
              version="${base}-beta.${n}"
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "Dev version ${version}"
            exit 0
          done

      - name: Read version
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            VERSION="${{ steps.dev_version.outputs.version }}"
            IMAGE_TAG=beta
          else
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
            IMAGE_TAG=latest
          fi
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            scope: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            scope: arm64
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Provenance attestations hide HEALTHCHECK from Podman.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          outputs: |
            type=image,name=ghcr.io/${{ needs.prepare.outputs.repo_lc }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/contabo-ddns,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: ${DIGEST:-empty}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.scope }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
      repo_lc: ${{ needs.prepare.outputs.repo_lc }}
      digest: ${{ steps.publish.outputs.digest }}
      dependency_update: ${{ needs.prepare.outputs.dependency_update }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish multi-arch manifests
        id: publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected 2 image digests, found ${#digests[@]}"
            find "$RUNNER_TEMP/digests" -type f -print
            exit 1
          fi
          ghcr_sources=()
          hub_sources=()
          for hex in "${digests[@]}"; do
            if ! [[ "$hex" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected digest file: ${hex}"
              exit 1
            fi
            ghcr_sources+=("ghcr.io/${REPO_LC}@sha256:${hex}")
            hub_sources+=("docker.io/${DOCKERHUB_USERNAME}/contabo-ddns@sha256:${hex}")
          done
          annotations=(
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --annotation "index:org.opencontainers.image.version=${VERSION}"
          )
          docker buildx imagetools create "${annotations[@]}" \
            -t "ghcr.io/${REPO_LC}:${IMAGE_TAG}" \
            -t "ghcr.io/${REPO_LC}:${VERSION}" \
            "${ghcr_sources[@]}"
          docker buildx imagetools create "${annotations[@]}" \
            -t "docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${IMAGE_TAG}" \
            -t "docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${VERSION}" \
            "${hub_sources[@]}"
          index_digest() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }
          ghcr_ref="ghcr.io/${REPO_LC}:${VERSION}"
          hub_ref="docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${VERSION}"
          ghcr_digest="$(index_digest "$ghcr_ref")"
          hub_digest="$(index_digest "$hub_ref")"
          for digest in "$ghcr_digest" "$hub_digest"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected manifest digest: ${digest:-empty}"
              exit 1
            fi
          done
          for ref in "$ghcr_ref" "$hub_ref"; do
            platforms="$(docker buildx imagetools inspect "$ref")"
            printf '%s\n' "$platforms"
            if ! printf '%s\n' "$platforms" | grep -q 'linux/amd64' || ! printf '%s\n' "$platforms" | grep -q 'linux/arm64'; then
              echo "::error::${ref} is missing linux/amd64 or linux/arm64"
              exit 1
            fi
          done
          if [ "$ghcr_digest" != "$hub_digest" ]; then
            echo "::error::GHCR digest ${ghcr_digest} does not match Docker Hub digest ${hub_digest}"
            exit 1
          fi
          echo "digest=${ghcr_digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
        run: |
          cosign sign --yes "ghcr.io/${REPO_LC}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_USERNAME}/contabo-ddns@${DIGEST}"

  smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image exits 2 without configuration
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          repo_lc="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo_lc}:${VERSION}"
          docker pull "$image"
          set +e
          docker run --rm "$image"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::${image} exited ${code}; expected 2 for missing configuration"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub tag is pullable
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: docker pull "docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${VERSION}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signatures
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          repo_lc="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          identity="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/deploy\\.yml@"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "ghcr.io/${repo_lc}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "docker.io/${DOCKERHUB_USERNAME}/contabo-ddns@${DIGEST}"

      - name: Post-deploy webhook
        env:
          WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not set; skipping webhook."
            exit 0
          fi
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg version "$VERSION" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg actor "${{ github.actor }}" \
            '{repository:$repo,version:$version,sha:$sha,run:{id:$run_id,number:$run_number},actor:$actor,status:"success",event:"deploy",timestamp:(now|todate)}')
          headers=(-H 'Content-Type: application/json')
          if [ -n "$WEBHOOK_SECRET" ]; then
            signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
            headers+=(-H "X-Signature-256: sha256=$signature")
          fi
          curl -fsSL -X POST "${headers[@]}" -d "$payload" "$WEBHOOK_URL"

  release:
    needs: [build-and-push, smoke]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          REPO_LC: ${{ needs.build-and-push.outputs.repo_lc }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [ "$REF_NAME" = "dev" ]; then
            prerelease=true
            make_latest=false
            channel=beta
            branch=dev
          else
            prerelease=false
            make_latest=true
            channel=latest
            branch=main
          fi

          # An existing tag stays where it was created. Rulesets reject moving it onto a later merge commit.
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            release_id="$(jq -r '.id' <<<"$release_json")"
          else
            release_id=""
          fi

          generated="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$SHA")"
          generated_body="$(jq -r '.body // empty' <<<"$generated" | grep -v 'chore: bump patch version to ' || true)"

          {
            echo "Image for \`${VERSION}\` from \`${branch}\`."
            echo
            echo "| Registry | Channel | Version |"
            echo "| --- | --- | --- |"
            echo "| GHCR | \`ghcr.io/${REPO_LC}:${channel}\` | \`ghcr.io/${REPO_LC}:${VERSION}\` |"
            echo "| Docker Hub | \`docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${channel}\` | \`docker.io/${DOCKERHUB_USERNAME}/contabo-ddns:${VERSION}\` |"
            echo
            echo "Both copies are signed by the deploy workflow through Sigstore. Verify with \`cosign verify\`."
            echo
            printf '%s\n' "$generated_body"
          } > release-notes.md

          if [ -n "$release_id" ]; then
            payload="$(jq -n \
              --arg tag "$tag" \
              --rawfile body release-notes.md \
              --argjson prerelease "$prerelease" \
              --arg make_latest "$make_latest" \
              '{tag_name:$tag, name:$tag, body:$body, draft:false, prerelease:$prerelease, make_latest:$make_latest}')"
            echo "$payload" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --input - >/dev/null
            echo "Updated ${tag}."
          else
            payload="$(jq -n \
              --arg tag "$tag" \
              --arg target "$SHA" \
              --rawfile body release-notes.md \
              --argjson prerelease "$prerelease" \
              --arg make_latest "$make_latest" \
              '{tag_name:$tag, target_commitish:$target, name:$tag, body:$body, draft:false, prerelease:$prerelease, make_latest:$make_latest}')"
            echo "$payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - >/dev/null
            echo "Created ${tag}."
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          echo "Release: ${url}"
          {
            echo "## ${tag}"
            echo
            echo "[${url}](${url})"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  promote-dev-to-main:
    needs: [build-and-push, smoke, release]
    if: github.ref_name == 'dev' && needs.build-and-push.outputs.dependency_update == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Push dev to main
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch origin main dev
          AHEAD=$(git rev-list --count origin/main..origin/dev)
          if [ "$AHEAD" -eq 0 ]; then
            echo "dev is not ahead of main; skipping push."
            exit 0
          fi
          git checkout -B main origin/main
          if git merge --ff-only origin/dev; then
            echo "Fast-forwarded main to dev."
          else
            git merge origin/dev -m "chore: promote dev to main after successful deploy (v${VERSION})"
          fi
          git push origin main

  create-dev-to-main-pr:
    needs: [build-and-push, smoke, release]
    if: github.ref_name == 'dev' && needs.build-and-push.outputs.dependency_update != 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Create pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create or update dev to main pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          AHEAD=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq '.ahead_by // 0')
          if [ "$AHEAD" -eq 0 ]; then
            echo "dev is not ahead of main; skipping PR."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Dev image was published and the container exited 2 with an empty environment.

          **Version:** v${VERSION}
          **Release:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}
          **Workflow run:** ${run_url}"

          existing="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Open PR already exists: #${existing}"
            gh pr comment "$existing" --body "Updated after successful dev deploy (v${VERSION}). See ${run_url}"
          else
            gh pr create \
              --base main \
              --head dev \
              --title "chore: promote dev to main (v${VERSION})" \
              --body "$body" \
              --assignee mikelock-1991
          fi
