[package]
name = "contabo-ddns"
version = "0.1.8"
edition = "2024"
description = "Update Contabo DNS A records and firewall source IPs"
publish = false

[dependencies]
flexi_logger = "=0.31.10"
log = "=0.4.35"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
signal-hook = "=0.4.6"
uuid = { version = "=1.29.2", features = ["v4"] }
webpki-root-certs = "=1.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
